<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<title>Anime · アニメ</title>
<link rel="preconnect" href="https://shikimori.one" crossorigin>
<link rel="dns-prefetch" href="https://api.allorigins.win">
<link rel="manifest" href='data:application/manifest+json,{"name":"Anime PWA","short_name":"Anime","start_url":".","display":"standalone","background_color":"#0b0b0f","theme_color":"#0b0b0f"}'>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0b0b0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
  .safe-top{padding-top:env(safe-area-inset-top)} .safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
  .no-scrollbar::-webkit-scrollbar{display:none}
  .blur-bg{background:rgba(15,15,20,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .chipx{background:rgba(255,255,255,.07);color:#d1d5db}
  .on{background:#0a84ff!important;color:#fff!important}
  .fade-in{animation:fadeIn .25s ease} @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .card{content-visibility:auto;contain-intrinsic-size:0 220px}
</style>
</head>
<body class="antialiased">

<!-- ================= ЭКРАН: ГЛАВНАЯ ================= -->
<div id="screen-home">
  <header class="safe-top sticky top-0 z-40 blur-bg border-b border-white/10 px-4 pt-3 pb-2">
    <div class="flex items-baseline gap-2">
      <h1 class="text-2xl font-extrabold tracking-tight">Anime</h1>
      <span class="text-xs text-gray-500">アニメ.</span>
    </div>
    <div class="flex gap-2 overflow-x-auto no-scrollbar pt-2 pb-1">
      <button data-sec="popular" class="sec-chip on shrink-0 px-4 py-2 rounded-full chipx text-sm font-medium">Популярное</button>
      <button data-sec="ongoing" class="sec-chip shrink-0 px-4 py-2 rounded-full chipx text-sm font-medium">Онгоинги</button>
      <button data-sec="fresh"   class="sec-chip shrink-0 px-4 py-2 rounded-full chipx text-sm font-medium">Свежее</button>
      <button data-sec="top"     class="sec-chip shrink-0 px-4 py-2 rounded-full chipx text-sm font-medium">Топ рейтинга</button>
      <button data-sec="random"  class="sec-chip shrink-0 px-4 py-2 rounded-full chipx text-sm">🍥</button>
    </div>
  </header>

  <main class="px-4 py-4 pb-24">
    <div id="home-loader" class="flex flex-col items-center gap-2 py-16">
      <div class="animate-spin rounded-full h-8 w-8 border-2 border-white/15 border-t-[#0a84ff]"></div>
      <span class="text-xs text-gray-500">Загрузка…</span>
    </div>
    <div id="home-grid" class="grid grid-cols-3 gap-3 fade-in"></div>
    <div id="home-more" class="hidden flex items-center justify-center gap-2 py-6 text-xs text-gray-500">
      <div class="h-4 w-4 animate-spin rounded-full border-2 border-white/15 border-t-[#0a84ff]"></div>Ещё…
    </div>
    <div id="home-empty" class="hidden text-center text-gray-500 text-sm py-16">Ничего не нашлось</div>
  </main>
</div>

<!-- ================= ЭКРАН: ПОИСК ================= -->
<div id="screen-search" class="hidden">
  <header class="safe-top sticky top-0 z-40 blur-bg border-b border-white/10 px-4 pt-3 pb-3">
    <div class="flex items-baseline gap-2 pb-2">
      <h1 class="text-2xl font-extrabold tracking-tight">Поиск</h1>
      <span class="text-xs text-gray-500">アニメ.</span>
    </div>
    <input id="search-input" type="search" placeholder="Название аниме…" autocomplete="off"
      class="w-full rounded-xl bg-white/10 px-4 py-3 text-[15px] outline-none ring-2 ring-transparent focus:ring-[#0a84ff] placeholder-gray-500">
  </header>

  <div id="search-status" class="hidden items-center gap-2 px-4 py-3 text-sm text-gray-400">
    <div class="h-4 w-4 animate-spin rounded-full border-2 border-white/15 border-t-[#0a84ff]"></div>
    <span id="search-status-text">Ищем…</span>
  </div>

  <main class="px-4 py-4 pb-24">
    <div id="search-hint" class="text-center text-gray-600 text-sm py-16">Введите название — например, «Наруто»</div>
    <div id="search-grid" class="grid grid-cols-3 gap-3 fade-in"></div>
    <div id="search-more" class="hidden flex items-center justify-center gap-2 py-6 text-xs text-gray-500">
      <div class="h-4 w-4 animate-spin rounded-full border-2 border-white/15 border-t-[#0a84ff]"></div>Ещё…
    </div>
    <div id="search-empty" class="hidden text-center text-gray-500 text-sm py-16">Ничего не нашлось</div>
  </main>
</div>

<!-- ================= ПЛЕЕР ================= -->
<div id="player" class="hidden fixed inset-0 z-50 bg-[#0b0b0f] flex-col safe-top">
  <div class="flex items-center gap-2 px-3 py-3 blur-bg border-b border-white/10">
    <button id="btn-back" class="flex items-center p-2 text-[#0a84ff] font-medium">
      <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>Назад
    </button>
    <h2 id="p-title" class="flex-1 truncate text-sm font-semibold"></h2>
  </div>

  <div class="flex-1 overflow-y-auto no-scrollbar pb-16">
    <div class="p-4">
      <div class="relative aspect-video overflow-hidden rounded-2xl border border-white/10 bg-black">
        <iframe id="p-iframe" class="w-full h-full" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>
        <div id="p-loader" class="absolute inset-0 grid place-items-center bg-black/70">
          <div class="text-center">
            <div class="mx-auto mb-2 h-8 w-8 animate-spin rounded-full border-2 border-white/15 border-t-white"></div>
            <div class="text-xs text-gray-400">Загрузка…</div>
          </div>
        </div>
        <div id="p-error" class="hidden absolute inset-0 grid place-items-center bg-black/85 px-4 text-center">
          <div>
            <div class="text-3xl mb-2">🎬</div>
            <div class="text-sm text-gray-300">Источник видео не подключён.</div>
            <div class="mt-1 text-xs text-gray-500">Попробуйте другую озвучку.</div>
          </div>
        </div>
      </div>

      <div id="p-voices" class="mt-3 flex gap-2 overflow-x-auto no-scrollbar"></div>
      <div id="p-meta" class="mt-3 text-xs text-gray-500"></div>
      <p id="p-desc" class="mt-2 text-sm leading-relaxed text-gray-300"></p>
    </div>
  </div>
</div>

<!-- ================= НИЖНИЙ ТУЛБАР ================= -->
<nav class="fixed inset-x-0 bottom-0 z-40 blur-bg border-t border-white/10 safe-bottom">
  <div class="flex">
    <button id="tab-home" class="flex flex-1 flex-col items-center py-2 text-[#0a84ff]">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
      <span class="text-[10px]">Главная</span>
    </button>
    <button id="tab-search" class="flex flex-1 flex-col items-center py-2 text-gray-500">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span class="text-[10px]">Поиск</span>
    </button>
  </div>
</nav>

<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] max-w-[90%] rounded-full bg-[#2c2c2e]/95 px-4 py-2 text-sm text-center"></div>

<script>
/* ============ КОНФИГ ============ */
const OWN_PROXY = '';
const SHIKI = 'https://shikimori.one';
const KODIK = 'https://kodik-api.com';
const LIMIT = 30;

const ENC_TOKENS = [
  "==QO0ADM3kTZmRTNiRDNjFDM==QOxkDMzQjZ4ADZ4zNhZTN",
  "==QNyE2NzIjM4ETM3MmNklDM==gY5EzNxIzY0gjZ1kDZkFDN",
  "==wMjhDN5QzYkNjZyQmM2ETO==QYjZjYkRjNxMWZ3YTNidzN",
  "==QZiZDNxITZlFDZwIjZ3EjM==AN0UmZlVzN4UWO3EDZ3QDN"
];

/* ============ ТОКЕНЫ (кеш = без лишнего запроса) ============ */
function decryptToken(t){
  try{
    const h = Math.floor(t.length/2);
    const a = t.substring(0,h).split('').reverse().join('');
    const b = t.substring(h).split('').reverse().join('');
    return atob(b) + atob(a);
  }catch(e){ return null; }
}
const TOKENS = ENC_TOKENS.map(decryptToken).filter(Boolean);
let KODIK_TOKEN = '';
let tokenPromise = null;
function ensureToken(){
  if (KODIK_TOKEN) return Promise.resolve(true);
  if (tokenPromise) return tokenPromise;
  let cached = null; try{ cached = localStorage.getItem('kodik_token'); }catch(e){}
  if (cached){ KODIK_TOKEN = cached; return Promise.resolve(true); } // мгновенно, без проверки
  return tokenPromise = (async () => {
    for (const t of TOKENS){
      KODIK_TOKEN = t;
      const r = await kodik('search', { shikimori_id:'20', limit:'1' });
      if (r && Array.isArray(r.results) && r.results.length){
        try{ localStorage.setItem('kodik_token', t); }catch(e){}
        return true;
      }
    }
    KODIK_TOKEN = TOKENS[0] || '';
    return false;
  })();
}

/* ============ FETCH + ПРОКСИ ============ */
const PROXIES = [
  u => u,
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];
async function fetchJSON(url, timeout = 6000){
  const chain = OWN_PROXY ? [u => OWN_PROXY + encodeURIComponent(u), ...PROXIES] : PROXIES;
  let err;
  for (const wrap of chain){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeout);
    try{
      const r = await fetch(wrap(url), { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok){ err = new Error('HTTP ' + r.status); continue; }
      return JSON.parse(await r.text());
    }catch(e){ clearTimeout(t); err = e; }
  }
  throw err || new Error('fetch failed');
}
async function shiki(path, params = {}){
  try{ return await fetchJSON(`${SHIKI}/api/${path}?` + new URLSearchParams(params)); }catch(e){ return null; }
}
async function kodik(path, params = {}){
  if (!KODIK_TOKEN) return null;
  try{ return await fetchJSON(`${KODIK}/${path}?` + new URLSearchParams({ token: KODIK_TOKEN, ...params })); }catch(e){ return null; }
}

/* ============ НОРМАЛИЗАЦИЯ ============ */
const normShiki = a => {
  const img = a.image || a.poster;
  return { sid: a.id, title: a.russian || a.name,
    poster: img ? SHIKI + (img.preview || img.original) : null, // preview = лёгкие картинки
    score: a.score, kind: a.kind, year: (a.aired_on || '').slice(0,4),
    desc: a.description || '', genres: (a.genres||[]).map(g=>g.russian) };
};
const normKodik = r => {
  const md = r.material_data || {};
  let poster = md.poster_url || md.anime_poster_url || null;
  if (poster && poster.startsWith('//')) poster = 'https:' + poster;
  return { sid: r.shikimori_id || null, title: md.title || r.title, poster,
    score: md.shikimori_rating || null, kind: md.anime_kind || r.type, year: r.year || md.year,
    desc: md.description || md.anime_description || '', genres: md.all_genres || [],
    voice: (r.translation && r.translation.title) || null, quality: r.quality || null,
    kodikLink: r.link };
};

/* ============ СЕКЦИИ ============ */
const SECTIONS = {
  popular: { shiki:{order:'popularity', kind:'tv'},
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true', sort:'shikimori_rating', order:'desc'} },
  ongoing: { shiki:{order:'popularity', status:'ongoing', kind:'tv'},
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true', anime_status:'ongoing'} },
  fresh:   { shiki:null,
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true', sort:'updated_at', order:'desc'} },
  top:     { shiki:{order:'score', kind:'tv'},
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true', sort:'shikimori_rating', order:'desc'} },
  random:  { shiki:{order:'random', kind:'tv'},
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true'} }
};

/* ============ ЛЕНТА (бесконечная) ============ */
const $ = id => document.getElementById(id);
const home = { sec:'popular' };
let homeState = null, homeReq = 0;
const homeCache = {}; // кеш секций в памяти — мгновенное переключение

async function loadHome(sec){
  const my = ++homeReq;
  home.sec = sec;
  const cached = homeCache[sec];
  if (cached && cached.items.length){ // мгновенно из кеша
    homeState = cached;
    homeLoading(false);
    $('home-grid').innerHTML = '';
    appendCards($('home-grid'), cached.items);
    cached.rendered = cached.items.length;
    $('home-empty').classList.add('hidden');
    return;
  }
  homeState = { items:[], keys:new Set(), page:1, nextUrl:null, done:false, source:null, rendered:0, loading:false };
  homeLoading(true);
  await fetchHomeChunk();
  if (my !== homeReq) return;
  homeLoading(false);
  appendCards($('home-grid'), homeState.items);
  homeState.rendered = homeState.items.length;
  $('home-empty').classList.toggle('hidden', homeState.items.length > 0);
  if (homeState.items.length) homeCache[sec] = homeState;
}

async function fetchHomeChunk(){
  const f = homeState, cfg = SECTIONS[home.sec];
  if (!f || f.loading) return;
  f.loading = true;
  if (f.rendered > 0) $('home-more').classList.remove('hidden');
  let got = [];
  if (f.source === 'shiki'){
    const s = await shiki('animes', Object.assign({}, cfg.shiki, { limit:LIMIT, page:f.page }));
    if (Array.isArray(s) && s.length){ got = s.map(normShiki); f.page++; if (s.length < LIMIT) f.done = true; }
    else f.done = true;
  } else if (f.source === 'kodik'){
    if (f.nextUrl){
      let k = null; try{ k = await fetchJSON(f.nextUrl); }catch(e){}
      if (k && k.results && k.results.length){ got = k.results.map(normKodik); f.nextUrl = k.next_page || null; if (!f.nextUrl) f.done = true; }
      else f.done = true;
    } else f.done = true;
  } else {
    if (cfg.shiki){
      const s = await shiki('animes', Object.assign({}, cfg.shiki, { limit:LIMIT, page:1 }));
      if (Array.isArray(s) && s.length){ got = s.map(normShiki); f.source = 'shiki'; f.page = 2; if (s.length < LIMIT) f.done = true; }
    }
    if (!got.length){
      await ensureToken();
      const k = await kodik('list', cfg.kodik);
      if (k && k.results && k.results.length){ got = k.results.map(normKodik); f.source = 'kodik'; f.nextUrl = k.next_page || null; if (!f.nextUrl) f.done = true; }
      else f.done = true;
    }
  }
  const before = f.items.length;
  got.forEach(it => { const k = it.sid || it.title; if (!f.keys.has(k)){ f.keys.add(k); f.items.push(it); } });
  if (f.rendered > 0 && f.items.length === before) f.done = true; // не зацикливаться впустую
  f.loading = false;
  $('home-more').classList.add('hidden');
}

async function loadHomeMore(){
  const f = homeState;
  if (!f || f.loading || f.done) return;
  const my = homeReq;
  await fetchHomeChunk();
  if (my !== homeReq) return;
  appendCards($('home-grid'), f.items.slice(f.rendered));
  f.rendered = f.items.length;
}

/* ============ ПОИСК (свой экран + бесконечный) ============ */
let searchState = null, searchReq = 0, searchCache = null, searchTimer;

async function doSearch(q, append = false){
  const my = ++searchReq;
  if (!append){
    if (searchCache && searchCache.q === q && searchCache.items.length){
      searchState = searchCache;
      $('search-grid').innerHTML = '';
      appendCards($('search-grid'), searchCache.items);
      searchCache.rendered = searchCache.items.length;
      $('search-hint').classList.add('hidden');
      $('search-empty').classList.add('hidden');
      searchStatus(null);
      return;
    }
    searchState = { q, items:[], keys:new Set(), page:1, done:false, source:null, rendered:0, loading:false };
    $('search-hint').classList.add('hidden');
    $('search-empty').classList.add('hidden');
    $('search-grid').innerHTML = '';
    searchStatus('Ищем «' + q + '»…');
  }
  await fetchSearchChunk(q);
  if (my !== searchReq) return;
  searchStatus(null);
  appendCards($('search-grid'), searchState.items.slice(searchState.rendered));
  searchState.rendered = searchState.items.length;
  $('search-empty').classList.toggle('hidden', searchState.items.length > 0);
  if (searchState.items.length) searchCache = searchState;
}

async function fetchSearchChunk(q){
  const f = searchState;
  if (!f || f.loading) return;
  f.loading = true;
  if (f.rendered > 0) $('search-more').classList.remove('hidden');
  let got = [];
  if (f.source === 'shiki'){
    const s = await shiki('animes', { search:q, limit:LIMIT, page:f.page });
    if (Array.isArray(s) && s.length){ got = s.map(normShiki); f.page++; if (s.length < LIMIT) f.done = true; }
    else f.done = true;
  } else {
    const s = await shiki('animes', { search:q, limit:LIMIT, page:1 });
    if (Array.isArray(s) && s.length){ got = s.map(normShiki); f.source = 'shiki'; f.page = 2; if (s.length < LIMIT) f.done = true; }
    if (!got.length){
      await ensureToken();
      const k = await kodik('search', { title:q, limit:LIMIT, types:'anime,anime-serial', with_material_data:'true' });
      if (k && k.results && k.results.length){ got = k.results.map(normKodik); f.source = 'kodik'; f.done = true; }
      else f.done = true;
    }
  }
  const before = f.items.length;
  got.forEach(it => { const k = it.sid || it.title; if (!f.keys.has(k)){ f.keys.add(k); f.items.push(it); } });
  if (f.rendered > 0 && f.items.length === before) f.done = true;
  f.loading = false;
  $('search-more').classList.add('hidden');
}

async function loadSearchMore(){
  const f = searchState;
  if (!f || f.loading || f.done) return;
  const q = $('search-input').value.trim();
  if (q !== f.q) return;
  const my = searchReq;
  await fetchSearchChunk(q);
  if (my !== searchReq) return;
  appendCards($('search-grid'), f.items.slice(f.rendered));
  f.rendered = f.items.length;
}

/* ============ UI ============ */
function toast(m){ const el = $('toast'); el.textContent = m; el.classList.remove('hidden');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('hidden'), 2500); }
function homeLoading(v){ $('home-loader').classList.toggle('hidden', !v);
  if (v){ $('home-grid').innerHTML = ''; $('home-empty').classList.add('hidden'); } }
function searchStatus(msg){ const el = $('search-status');
  if (!msg){ el.classList.add('hidden'); el.classList.remove('flex'); return; }
  el.classList.remove('hidden'); el.classList.add('flex');
  $('search-status-text').textContent = msg; }

function appendCards(grid, arr){
  arr.forEach(it => {
    const b = document.createElement('button');
    b.className = 'card text-left active:scale-95 transition-transform';
    b.onclick = () => openPlayer(it);
    b.innerHTML = `
      <div class="relative mb-1.5 aspect-[2/3] overflow-hidden rounded-lg bg-white/5">
        ${it.poster ? `<img src="${it.poster}" loading="lazy" decoding="async" class="h-full w-full object-cover">` : '<div class="grid h-full w-full place-items-center text-[10px] text-gray-600">нет постера</div>'}
        ${it.score ? `<span class="absolute right-1 top-1 rounded bg-black/70 px-1.5 py-0.5 text-[10px] font-bold">★ ${it.score}</span>` : ''}
      </div>
      <div class="line-clamp-2 text-xs font-medium leading-tight">${it.title}</div>`;
    grid.appendChild(b);
  });
}

function setTab(name){
  const h = name === 'home';
  $('screen-home').classList.toggle('hidden', !h);
  $('screen-search').classList.toggle('hidden', h);
  $('tab-home').classList.toggle('text-[#0a84ff]', h);
  $('tab-home').classList.toggle('text-gray-500', !h);
  $('tab-search').classList.toggle('text-[#0a84ff]', !h);
  $('tab-search').classList.toggle('text-gray-500', h);
  if (!h) setTimeout(() => $('search-input').focus(), 60);
}

/* ============ ПЛЕЕР ============ */
async function openPlayer(item){
  $('player').classList.remove('hidden'); $('player').classList.add('flex');
  document.body.style.overflow = 'hidden';
  $('p-title').textContent = item.title;
  $('p-iframe').src = 'about:blank';
  $('p-loader').classList.remove('hidden');
  $('p-error').classList.add('hidden');
  $('p-voices').innerHTML = '';
  $('p-meta').textContent = [item.kind, item.year, item.score ? '★ ' + item.score : ''].filter(Boolean).join(' · ');
  $('p-desc').textContent = item.desc || 'Загрузка…';

  if (!item.desc && item.sid){
    const d = await shiki('animes/' + item.sid);
    $('p-desc').textContent = (d && d.description) ? d.description : 'Описание отсутствует';
  } else $('p-desc').textContent = item.desc || 'Описание отсутствует';

  await ensureToken();
  let results = [];
  if (item.sid){
    const k = await kodik('search', { shikimori_id:item.sid, with_material_data:'true' });
    if (k && k.results && k.results.length) results = k.results.map(normKodik);
  }
  if (!results.length){
    const k = await kodik('search', { title:item.title, limit:'10', types:'anime,anime-serial' });
    if (k && k.results && k.results.length) results = k.results.map(normKodik);
  }
  if (!results.length){
    $('p-loader').classList.add('hidden');
    $('p-error').classList.remove('hidden');
    return;
  }

  const v = $('p-voices');
  results.forEach((r, i) => {
    const b = document.createElement('button');
    b.className = 'chipx shrink-0 rounded-full px-3 py-1.5 text-xs' + (i === 0 ? ' on' : '');
    b.textContent = (r.voice || 'Вариант ' + (i+1)) + (r.quality ? ' · ' + r.quality : '');
    b.onclick = () => { v.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); setPlayer(r); };
    v.appendChild(b);
  });
  setPlayer(results[0]);
}
function setPlayer(r){
  let l = r.kodikLink || '';
  if (l.startsWith('//')) l = 'https:' + l;
  $('p-iframe').src = l;
  $('p-iframe').onload = () => $('p-loader').classList.add('hidden');
  $('p-meta').textContent = [r.kind, r.year, r.quality, r.voice ? '🎙 ' + r.voice : '', r.score ? '★ ' + r.score : ''].filter(Boolean).join(' · ');
}
function closePlayer(){
  $('player').classList.add('hidden'); $('player').classList.remove('flex');
  $('p-iframe').src = 'about:blank';
  document.body.style.overflow = '';
}

/* ============ СОБЫТИЯ ============ */
document.querySelectorAll('.sec-chip').forEach(ch => ch.onclick = () => {
  document.querySelectorAll('.sec-chip').forEach(c => c.classList.remove('on'));
  ch.classList.add('on');
  if (ch.dataset.sec === 'random') toast('🍥 Случайная подборка');
  loadHome(ch.dataset.sec);
});
$('tab-home').onclick = () => setTab('home');
$('tab-search').onclick = () => setTab('search');
$('btn-back').onclick = closePlayer;

$('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q){
    searchReq++;
    searchStatus(null);
    $('search-grid').innerHTML = '';
    $('search-empty').classList.add('hidden');
    $('search-hint').classList.remove('hidden');
    return;
  }
  searchTimer = setTimeout(() => doSearch(q), 350);
});

/* Бесконечная прокрутка: дошли до низа — грузим ещё */
window.addEventListener('scroll', () => {
  if (!$('player').classList.contains('hidden')) return;
  if (window.innerHeight + window.scrollY < document.body.offsetHeight - 800) return;
  if (!$('screen-home').classList.contains('hidden')) loadHomeMore();
  else loadSearchMore();
}, { passive:true });

/* ============ СТАРТ ============ */
setTab('home');
loadHome('popular');
</script>
</body>
</html>
