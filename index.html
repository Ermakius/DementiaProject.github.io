<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<title>Anime · アニメ</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" id="manifest-link">
<link rel="preconnect" href="https://shikimori.one" crossorigin>
<link rel="preconnect" href="https://api.allorigins.win" crossorigin>
<link rel="preconnect" href="https://corsproxy.io" crossorigin>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0b0b0f;color:#fff;font:15px/1.4 -apple-system,BlinkMacSystemFont,Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:0;border:0;cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover}
.hidden{display:none!important}
.st{padding-top:env(safe-area-inset-top)}.sb{padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:40;padding:10px 14px 8px;background:rgba(15,15,20,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #ffffff14}
.lr{display:flex;align-items:baseline;gap:8px}
.logo{font-size:clamp(20px,6vw,26px);font-weight:800;letter-spacing:-.5px}
.sub{font-size:11px;color:#98989f}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 15px;border-radius:999px;background:#ffffff12;color:#d1d5db;font-size:14px}
.chip.on{background:#0a84ff;color:#fff}
.content{padding:14px 14px 92px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.card{cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.95)}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c;margin-bottom:5px;content-visibility:auto;contain-intrinsic-size:0 200px}
.ph{width:100%;height:100%;display:grid;place-items:center;color:#565661}
.badge{position:absolute;top:4px;right:4px;background:#000b;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:700}
.rm{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#000c;color:#ff375f;font-size:12px;display:grid;place-items:center}
.ctitle{font-size:12px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skel{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(100deg,#17171c 40%,#23232c 50%,#17171c 60%);background-size:200% 100%;animation:sh 1.1s infinite}
.sl{height:12px;margin-top:5px;border-radius:4px;aspect-ratio:auto}
@keyframes sh{to{background-position:-200% 0}}
.more{display:flex;justify-content:center;align-items:center;gap:8px;padding:22px 0;color:#98989f;font-size:12px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #ffffff1f;border-top-color:#0a84ff;animation:sp .8s linear infinite}
.spin.s{width:15px;height:15px;border-width:2px}
@keyframes sp{to{transform:rotate(1turn)}}
.empty{text-align:center;color:#98989f;font-size:14px;padding:60px 0}
.search{width:100%;margin-top:10px;background:#ffffff1a;border:0;border-radius:12px;padding:12px 15px;color:#fff;font-size:15px;outline:none}
.search:focus{box-shadow:0 0 0 2px #0a84ff}
.status{display:flex;align-items:center;gap:8px;padding:12px 16px;color:#98989f;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(15,15,20,.8);backdrop-filter:blur(16px);border-top:1px solid #ffffff14}
.tabs>div{display:flex;max-width:760px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:#6b6b74}
.tab svg{width:24px;height:24px}.tab span{font-size:10px}.tab.on{color:#0a84ff}
.player{position:fixed;inset:0;z-index:50;background:#0b0b0f;display:none;flex-direction:column}
.player.open{display:flex}
.ph-head{display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(15,15,20,.8);backdrop-filter:blur(16px);border-bottom:1px solid #ffffff14}
.back{display:flex;align-items:center;gap:4px;color:#0a84ff;padding:8px}
.back svg{width:20px;height:20px}
.pt{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{font-size:20px;color:#6b6b74;padding:6px 10px}
.fav.on{color:#ff375f}
.pb{flex:1;overflow-y:auto;padding:14px 14px 60px;scrollbar-width:none;max-width:760px;margin:0 auto}
.pb::-webkit-scrollbar{display:none}
.pw{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid #ffffff14}
.pw iframe{width:100%;height:100%;border:0}
.po{position:absolute;inset:0;display:grid;place-items:center;background:#000b;text-align:center;padding:16px}
.po .t{font-size:12px;color:#9ca3af;margin-top:8px}
.voices{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.voices::-webkit-scrollbar{display:none}
.voice{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:#ffffff12;font-size:12px;color:#d1d5db}
.voice.on{background:#0a84ff;color:#fff}
.meta{margin-top:12px;font-size:12px;color:#6b6b74}
.desc{margin-top:8px;font-size:14px;line-height:1.55;color:#d1d5db}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:#2c2c2ef2;padding:8px 16px;border-radius:999px;font-size:14px;max-width:90%}
@media(min-width:760px){.content{max-width:760px;margin:0 auto}}
</style>
</head>
<body>

<div id="screen-home">
  <header class="top st">
    <div class="lr"><h1 class="logo">Anime</h1><span class="sub">アニメ.</span></div>
    <div class="chips">
      <button data-sec="popular" class="sec-chip on">Популярное</button>
      <button data-sec="ongoing" class="sec-chip">Онгоинги</button>
      <button data-sec="fresh" class="sec-chip">Свежее</button>
      <button data-sec="top" class="sec-chip">Топ</button>
      <button data-sec="random" class="sec-chip">🍥</button>
    </div>
  </header>
  <main class="content">
    <div id="home-grid" class="grid"></div>
    <div id="home-more" class="more hidden"><div class="spin s"></div>Ещё…</div>
    <div id="home-empty" class="empty hidden">Ничего не нашлось</div>
  </main>
</div>

<div id="screen-search" class="hidden">
  <header class="top st">
    <div class="lr"><h1 class="logo">Поиск</h1><span class="sub">アニメ.</span></div>
    <input id="search-input" type="search" class="search" placeholder="Название аниме…" autocomplete="off">
  </header>
  <div id="search-status" class="status hidden"><div class="spin s"></div><span id="sst">Ищем…</span></div>
  <main class="content">
    <div id="search-hint" class="empty">Введите название — например, «Наруто»</div>
    <div id="search-grid" class="grid"></div>
    <div id="search-more" class="more hidden"><div class="spin s"></div>Ещё…</div>
    <div id="search-empty" class="empty hidden">Ничего не нашлось</div>
  </main>
</div>

<div id="screen-fav" class="hidden">
  <header class="top st"><div class="lr"><h1 class="logo">Избранное</h1><span class="sub">アニメ.</span></div></header>
  <main class="content">
    <div id="fav-grid" class="grid"></div>
    <div id="fav-empty" class="empty">Пока пусто. Жми ♥ в плеере, чтобы сохранить аниме.</div>
  </main>
</div>

<div id="player" class="player st">
  <div class="ph-head">
    <button id="btn-back" class="back"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>Назад</button>
    <h2 id="p-title" class="pt"></h2>
    <button id="btn-fav" class="fav">♥</button>
  </div>
  <div class="pb">
    <div class="pw">
      <iframe id="p-iframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
      <div id="p-loader" class="po"><div><div class="spin" style="margin:0 auto"></div><div class="t">Загрузка…</div></div></div>
      <div id="p-error" class="po hidden"><div><div style="font-size:30px">🎬</div><div style="font-size:14px;color:#d1d5db;margin-top:6px">Источник видео не подключён.</div><div style="font-size:12px;color:#6b6b74;margin-top:4px">Попробуйте другую озвучку.</div></div></div>
    </div>
    <div id="p-voices" class="voices"></div>
    <div id="p-meta" class="meta"></div>
    <p id="p-desc" class="desc"></p>
  </div>
</div>

<nav class="tabs sb"><div>
  <button data-tab="home" class="tab on"><svg fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg><span>Главная</span></button>
  <button data-tab="search" class="tab"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><span>Поиск</span></button>
  <button data-tab="fav" class="tab"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg><span>Избранное</span></button>
</div></nav>

<div id="toast" class="toast hidden"></div>

<script>
/* PWA: манифест + SW */
(()=>{ const i=new URL('icon.png',location.href).href;
  document.getElementById('manifest-link').href=URL.createObjectURL(new Blob([JSON.stringify({name:'Anime PWA',short_name:'Anime',start_url:'.',display:'standalone',background_color:'#0b0b0f',theme_color:'#0b0b0f',icons:[{src:i,sizes:'192x192',type:'image/png'},{src:i,sizes:'512x512',type:'image/png'}]})],{type:'application/manifest+json'}));
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

const OWN_PROXY='', SHIKI='https://shikimori.one', KODIK='https://kodik-api.com', L=30, TTL=6e5, $=id=>document.getElementById(id);
const TOKENS=["==QO0ADM3kTZmRTNiRDNjFDM==QOxkDMzQjZ4ADZ4zNhZTN","==QNyE2NzIjM4ETM3MmNklDM==gY5EzNxIzY0gjZ1kDZkFDN","==wMjhDN5QzYkNjZyQmM2ETO==QYjZjYkRjNxMWZ3YTNidzN","==QZiZDNxITZlFDZwIjZ3EjM==AN0UmZlVzN4UWO3EDZ3QDN"]
  .map(t=>{try{const h=t.length>>1;return atob(t.slice(h).split('').reverse().join(''))+atob(t.slice(0,h).split('').reverse().join(''))}catch(e){return null}}).filter(Boolean);
let KT='',tokP=null;
const tok=()=>KT?Promise.resolve(1):tokP||(tokP=(async()=>{let c=null;try{c=localStorage.getItem('kodik_token')}catch(e){}
  if(c){KT=c;return 1}
  for(const t of TOKENS){KT=t;const r=await kod('search',{shikimori_id:'20',limit:'1'});if(r&&r.results&&r.results.length){try{localStorage.setItem('kodik_token',t)}catch(e){}return 1}}
  KT=TOKENS[0]||'';return 0})());

/* FETCH: гонка прокси */
const RACE=[u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u)];
const FALL=[u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
const anyP=Promise.any?Promise.any.bind(Promise):ps=>new Promise((r,j)=>{let n=0;ps.forEach(p=>p.then(r,()=>{++n===ps.length&&j()}))});
const via=(u,t)=>{const c=new AbortController(),s=setTimeout(()=>c.abort(),t);
  return fetch(u,{signal:c.signal}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(x=>{clearTimeout(s);return JSON.parse(x)}).catch(e=>{clearTimeout(s);throw e})};
async function F(url){ if(OWN_PROXY)try{return await via(OWN_PROXY+encodeURIComponent(url),6500)}catch(e){}
  try{return await anyP(RACE.map(w=>via(w(url),6500)))}catch(e){}
  for(const w of FALL)try{return await via(w(url),6500)}catch(e){}
  throw 0 }
const shiki=(p,q={})=>F(`${SHIKI}/api/${p}?`+new URLSearchParams(q)).catch(()=>null);
const kod=(p,q={})=>KT?F(`${KODIK}/${p}?`+new URLSearchParams({token:KT,...q})).catch(()=>null):null;

/* Нормализация + фолбэк картинок */
const nS=a=>{const m=a.image||a.poster||{};return{sid:a.id,title:a.russian||a.name,poster:m.preview?SHIKI+m.preview:(m.original?SHIKI+m.original:null),full:m.original?SHIKI+m.original:null,score:a.score,kind:a.kind,year:(a.aired_on||'').slice(0,4),desc:a.description||''}};
const nK=r=>{const d=r.material_data||{};let p=d.poster_url||d.anime_poster_url||null;if(p&&p.startsWith('//'))p='https:'+p;
  return{sid:r.shikimori_id||null,title:d.title||r.title,poster:p,full:p,score:d.shikimori_rating||null,kind:d.anime_kind||r.type,year:r.year||d.year,desc:d.description||d.anime_description||'',voice:(r.translation&&r.translation.title)||null,quality:r.quality||null,link:r.link}};
function imgErr(im){const a=im.getAttribute('data-alt');if(a&&im.src!==a){im.removeAttribute('data-alt');im.src=a;return}
  const d=document.createElement('div');d.className='ph';d.textContent='🎬';im.replaceWith(d)}

const SEC={
  popular:{s:{order:'popularity',kind:'tv'},k:{limit:L,types:'anime,anime-serial',with_material_data:'true',sort:'shikimori_rating',order:'desc'}},
  ongoing:{s:{order:'popularity',status:'ongoing',kind:'tv'},k:{limit:L,types:'anime,anime-serial',with_material_data:'true',anime_status:'ongoing'}},
  fresh:{s:null,k:{limit:L,types:'anime,anime-serial',with_material_data:'true',sort:'updated_at',order:'desc'}},
  top:{s:{order:'score',kind:'tv'},k:{limit:L,types:'anime,anime-serial',with_material_data:'true',sort:'shikimori_rating',order:'desc'}},
  random:{s:{order:'random',kind:'tv'},k:{limit:L,types:'anime,anime-serial',with_material_data:'true'}}
};

/* Хранилище */
const LS={get:k=>{try{return JSON.parse(localStorage.getItem('a_'+k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('a_'+k,JSON.stringify(v))}catch(e){}}};
const fresh=()=>({items:[],keys:new Set(),page:1,next:null,done:false,src:null,rendered:0,busy:false});
const pack=f=>({t:Date.now(),items:f.items.slice(0,300),page:f.page,next:f.next,done:f.done,src:f.src});
const un=c=>({...fresh(),items:c.items,keys:new Set(c.items.map(i=>i.sid||i.title)),page:c.page||1,next:c.next||null,done:!!c.done,src:c.src||null});
const feeds={};

/* Универсальный чанк (лента) */
async function chunk(f,type,arg){
  if(f.busy)return; f.busy=true;
  const ap=f.rendered>0, m=$(type=='q'?'search-more':'home-more');
  if(ap)m.classList.remove('hidden');
  let got=[];
  if(type=='q'){
    if(f.src=='kodik')f.done=true;
    else{
      const s=await shiki('animes',{search:arg,limit:L,page:f.page});
      if(s&&s.length){got=s.map(nS);f.src='shiki';f.page++;if(s.length<L)f.done=true}
      else if(f.src=='shiki')f.done=true;
      else{await tok();const k=await kod('search',{title:arg,limit:L,types:'anime,anime-serial',with_material_data:'true'});
        if(k&&k.results&&k.results.length)got=k.results.map(nK);f.src='kodik';f.done=true}
    }
  }else{
    const c=SEC[arg];
    if(f.src=='shiki'){const s=await shiki('animes',Object.assign({},c.s,{limit:L,page:f.page}));
      if(s&&s.length){got=s.map(nS);f.page++;if(s.length<L)f.done=true}else f.done=true}
    else if(f.src=='kodik'){ if(f.next){const k=await F(f.next).catch(()=>null);
        if(k&&k.results&&k.results.length){got=k.results.map(nK);f.next=k.next_page||null}}
      f.done=!f.next}
    else{ if(c.s){const s=await shiki('animes',Object.assign({},c.s,{limit:L,page:1}));
        if(s&&s.length){got=s.map(nS);f.src='shiki';f.page=2;if(s.length<L)f.done=true}}
      if(!got.length){await tok();const k=await kod('list',c.k);
        if(k&&k.results&&k.results.length){got=k.results.map(nK);f.src='kodik';f.next=k.next_page||null}
        f.done=!f.next}}
  }
  const b=f.items.length;
  got.forEach(i=>{const k=i.sid||i.title;if(!f.keys.has(k)){f.keys.add(k);f.items.push(i)}});
  if(ap&&f.items.length===b)f.done=true;
  f.busy=false;m.classList.add('hidden');
}

/* Карточки */
function cards(g,arr,from,rm){
  arr.forEach((it,i)=>{
    const d=document.createElement('div');d.className='card';
    const img=it.poster?'<img src="'+it.poster+'"'+(it.full&&it.full!==it.poster?' data-alt="'+it.full+'"':'')+' loading="lazy" decoding="async"'+(from+i<9?' fetchpriority="high"':'')+' onerror="imgErr(this)">':'<div class="ph">🎬</div>';
    d.innerHTML='<div class="poster">'+img+(it.score?'<span class="badge">★'+it.score+'</span>':'')+(rm?'<span class="rm" data-i="'+(from+i)+'">✕</span>':'')+'</div><div class="ctitle">'+it.title+'</div>';
    d.onclick=e=>{
      if(e.target.classList.contains('rm')){e.stopPropagation();favs.splice(+e.target.dataset.i,1);LS.set('favs',favs);renderFavs();toast('Убрано из избранного');return}
      openPlayer(it);
    };
    g.appendChild(d);
  });
}
const skeleton=(g,n=12)=>{let h='';for(let i=0;i<n;i++)h+='<div><div class="skel"></div><div class="skel sl"></div></div>';g.innerHTML=h};

/* ============ ГЛАВНАЯ ============ */
let homeSec='popular',reqH=0;
async function loadSec(sec){
  const my=++reqH;homeSec=sec;
  const key='sec_'+sec;let f=feeds[key];
  if(!f){const c=LS.get(key);if(c&&c.items&&c.items.length&&Date.now()-c.t<TTL)f=un(c)}
  if(!f){f=fresh();skeleton($('home-grid'));await chunk(f,'sec',sec);if(my!==reqH)return;
    if(f.items.length){feeds[key]=f;LS.set(key,pack(f))}}
  feeds[key]=f;
  $('home-grid').innerHTML='';cards($('home-grid'),f.items,0,false);f.rendered=f.items.length;
  $('home-empty').classList.toggle('hidden',f.items.length>0);
}
async function moreSec(){
  const f=feeds['sec_'+homeSec];if(!f||f.busy||f.done)return;
  const my=reqH,o=f.rendered;await chunk(f,'sec',homeSec);if(my!==reqH)return;
  cards($('home-grid'),f.items.slice(o),o,false);f.rendered=f.items.length;LS.set('sec_'+homeSec,pack(f));
}

/* ============ ПОИСК ============ */
let reqS=0,sTimer;
async function doSearch(q,ap){
  const my=++reqS,key='q_'+q;let f=feeds[key];
  if(!ap){
    if(!f){const c=LS.get('q');if(c&&c.q===q&&c.items&&c.items.length&&Date.now()-c.t<TTL)f=un(c)}
    if(f){feeds[key]=f;$('search-grid').innerHTML='';cards($('search-grid'),f.items,0,false);f.rendered=f.items.length;
      $('search-hint').classList.add('hidden');$('search-empty').classList.toggle('hidden',f.items.length>0);status(null);return}
    f=fresh();$('search-hint').classList.add('hidden');$('search-empty').classList.add('hidden');
    skeleton($('search-grid'),6);status('Ищем «'+q+'»…');
  }
  await chunk(f,'q',q);if(my!==reqS)return;
  status(null);
  const o=ap?f.rendered:0;if(!ap)$('search-grid').innerHTML='';
  cards($('search-grid'),f.items.slice(o),o,false);f.rendered=f.items.length;
  $('search-empty').classList.toggle('hidden',f.items.length>0);
  if(f.items.length){feeds[key]=f;LS.set('q',{...pack(f),q})}
}
async function moreSearch(){
  const q=$('search-input').value.trim(),f=feeds['q_'+q];
  if(!f||f.busy||f.done)return;
  const my=reqS,o=f.rendered;await chunk(f,'q',q);if(my!==reqS)return;
  cards($('search-grid'),f.items.slice(o),o,false);f.rendered=f.items.length;
}
const status=m=>{$('search-status').classList.toggle('hidden',!m);if(m)$('sst').textContent=m};

/* ============ ИЗБРАННОЕ ============ */
let favs=LS.get('favs')||[],cur=null;
const fkey=i=>i.sid||i.title;
const isFav=i=>favs.some(f=>fkey(f)===fkey(i));
function toggleFav(i){const was=isFav(i);
  favs=was?favs.filter(f=>fkey(f)!==fkey(i)):[i,...favs];
  LS.set('favs',favs);heart();
  if(!$('screen-fav').classList.contains('hidden'))renderFavs();
  toast(was?'Убрано из избранного':'♥ Добавлено в избранное');}
function renderFavs(){$('fav-grid').innerHTML='';cards($('fav-grid'),favs,0,true);
  $('fav-empty').classList.toggle('hidden',favs.length>0)}
const heart=()=>$('btn-fav').classList.toggle('on',!!cur&&isFav(cur));

/* ============ ПЛЕЕР ============ */
async function openPlayer(it){
  cur=it;heart();
  $('player').classList.add('open');document.body.style.overflow='hidden';
  $('p-title').textContent=it.title;
  $('p-iframe').src='about:blank';
  $('p-loader').classList.remove('hidden');$('p-error').classList.add('hidden');$('p-voices').innerHTML='';
  $('p-meta').textContent=[it.kind,it.year,it.score?'★ '+it.score:''].filter(Boolean).join(' · ');
  $('p-desc').textContent=it.desc||'Загрузка…';
  if(!it.desc&&it.sid){const d=await shiki('animes/'+it.sid);$('p-desc').textContent=d&&d.description?d.description:'Описание отсутствует'}
  else if(!it.desc)$('p-desc').textContent='Описание отсутствует';
  await tok();
  let res=[];
  if(it.sid){const k=await kod('search',{shikimori_id:it.sid,with_material_data:'true'});if(k&&k.results&&k.results.length)res=k.results.map(nK)}
  if(!res.length){const k=await kod('search',{title:it.title,limit:'10',types:'anime,anime-serial'});if(k&&k.results&&k.results.length)res=k.results.map(nK)}
  if(!res.length){$('p-loader').classList.add('hidden');$('p-error').classList.remove('hidden');return}
  const v=$('p-voices');
  res.forEach((r,i)=>{const b=document.createElement('button');b.className='voice'+(i?'':' on');
    b.textContent=(r.voice||'Вариант '+(i+1))+(r.quality?' · '+r.quality:'');
    b.onclick=()=>{v.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');setP(r)};
    v.appendChild(b)});
  setP(res[0]);
}
function setP(r){let l=r.link||'';if(l.startsWith('//'))l='https:'+l;
  $('p-iframe').src=l;$('p-iframe').onload=()=>$('p-loader').classList.add('hidden');
  $('p-meta').textContent=[r.kind,r.year,r.quality,r.voice?'🎙 '+r.voice:'',r.score?'★ '+r.score:''].filter(Boolean).join(' · ')}
const closeP=()=>{$('player').classList.remove('open');$('p-iframe').src='about:blank';document.body.style.overflow=''};

/* ============ UI ============ */
function toast(m){const el=$('toast');el.textContent=m;el.classList.remove('hidden');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.add('hidden'),2200)}
let tab='home';
function setTab(t){tab=t;
  ['home','search','fav'].forEach(s=>$('screen-'+s).classList.toggle('hidden',s!==t));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='search')setTimeout(()=>$('search-input').focus(),60);
  if(t==='fav')renderFavs();}

document.querySelectorAll('.sec-chip').forEach(ch=>ch.onclick=()=>{
  document.querySelectorAll('.sec-chip').forEach(c=>c.classList.remove('on'));ch.classList.add('on');
  if(ch.dataset.sec==='random')toast('🍥 Случайная подборка');
  loadSec(ch.dataset.sec)});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('btn-back').onclick=closeP;
$('btn-fav').onclick=()=>cur&&toggleFav(cur);
$('search-input').addEventListener('input',e=>{clearTimeout(sTimer);const q=e.target.value.trim();
  if(!q){reqS++;status(null);$('search-grid').innerHTML='';$('search-empty').classList.add('hidden');$('search-hint').classList.remove('hidden');return}
  sTimer=setTimeout(()=>doSearch(q),350)});
window.addEventListener('scroll',()=>{
  if($('player').classList.contains('open'))return;
  if(window.innerHeight+window.scrollY<document.body.offsetHeight-800)return;
  if(tab==='home')moreSec();else if(tab==='search')moreSearch();
},{passive:true});

setTab('home');loadSec('popular');
</script>
</body>
</html>
