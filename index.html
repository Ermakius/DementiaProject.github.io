<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<title>Anime · アニメ</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" id="manifest-link">
<link rel="preconnect" href="https://shikimori.one" crossorigin>
<link rel="preconnect" href="https://api.allorigins.win" crossorigin>
<link rel="preconnect" href="https://corsproxy.io" crossorigin>
<link rel="preconnect" href="https://api.codetabs.com" crossorigin>
<style>
:root{--bg:#0b0b0f;--card:#17171c;--blue:#0a84ff;--mut:#98989f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
.hidden{display:none!important}
.safe-top{padding-top:env(safe-area-inset-top)} .safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:40;padding:12px 16px 8px;background:rgba(15,15,20,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
.logo-row{display:flex;align-items:baseline;gap:8px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px}
.logo-sub{font-size:11px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.07);color:#d1d5db;font-size:14px;font-weight:500}
.chip.on{background:var(--blue);color:#fff}
.content{padding:16px 16px 96px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{text-align:left;transition:transform .1s}
.card:active{transform:scale(.95)}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);margin-bottom:6px;content-visibility:auto;contain-intrinsic-size:0 220px}
.poster img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:10px;color:#565661}
.badge{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border-radius:5px;padding:2px 6px;font-size:10px;font-weight:700}
.ctitle{font-size:12px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skel{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(100deg,#17171c 40%,#23232c 50%,#17171c 60%);background-size:200% 100%;animation:sh 1.1s infinite}
.skel-line{height:12px;margin-top:6px;border-radius:4px;aspect-ratio:auto}
@keyframes sh{to{background-position:-200% 0}}
.more{display:flex;justify-content:center;align-items:center;gap:8px;padding:24px 0;color:var(--mut);font-size:12px}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--blue);animation:sp .8s linear infinite}
.spin.small{width:16px;height:16px;border-width:2px}
@keyframes sp{to{transform:rotate(1turn)}}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:64px 0}
.search{width:100%;margin-top:10px;background:rgba(255,255,255,.1);border:0;border-radius:12px;padding:12px 16px;color:#fff;font-size:15px;outline:none;box-shadow:0 0 0 2px transparent}
.search:focus{box-shadow:0 0 0 2px var(--blue)}
.search::placeholder{color:#6b6b74}
.status{display:flex;align-items:center;gap:8px;padding:12px 16px;color:var(--mut);font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(15,15,20,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.08)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:#6b6b74}
.tab svg{width:24px;height:24px}
.tab span{font-size:10px}
.tab.on{color:var(--blue)}
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
.player.open{display:flex}
.p-head{display:flex;align-items:center;gap:8px;padding:12px;background:rgba(15,15,20,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
.back{display:flex;align-items:center;gap:4px;color:var(--blue);font-weight:500;padding:8px}
.back svg{width:20px;height:20px}
.p-title{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-body{flex:1;overflow-y:auto;padding:16px 16px 64px;scrollbar-width:none}
.p-body::-webkit-scrollbar{display:none}
.p-wrap{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.08)}
.p-wrap iframe{width:100%;height:100%;border:0}
.p-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.7);text-align:center;padding:16px}
.p-overlay .txt{font-size:12px;color:#9ca3af;margin-top:8px}
.p-err-emoji{font-size:30px;margin-bottom:8px}
.p-err-title{font-size:14px;color:#d1d5db}
.p-err-sub{font-size:12px;color:#6b6b74;margin-top:4px}
.voices{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.voices::-webkit-scrollbar{display:none}
.voice{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;color:#d1d5db}
.voice.on{background:var(--blue);color:#fff}
.meta{margin-top:12px;font-size:12px;color:#6b6b74}
.desc{margin-top:8px;font-size:14px;line-height:1.55;color:#d1d5db}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:rgba(44,44,46,.95);padding:8px 16px;border-radius:999px;font-size:14px;max-width:90%;text-align:center}
</style>
</head>
<body>

<!-- ================= ГЛАВНАЯ ================= -->
<div id="screen-home">
  <header class="top safe-top">
    <div class="logo-row"><h1 class="logo">Anime</h1><span class="logo-sub">アニメ.</span></div>
    <div class="chips">
      <button data-sec="popular" class="sec-chip on">Популярное</button>
      <button data-sec="ongoing" class="sec-chip">Онгоинги</button>
      <button data-sec="fresh"   class="sec-chip">Свежее</button>
      <button data-sec="top"     class="sec-chip">Топ рейтинга</button>
      <button data-sec="random"  class="sec-chip">🍥</button>
    </div>
  </header>
  <main class="content">
    <div id="home-grid" class="grid"></div>
    <div id="home-more" class="more hidden"><div class="spin small"></div>Ещё…</div>
    <div id="home-empty" class="empty hidden">Ничего не нашлось</div>
  </main>
</div>

<!-- ================= ПОИСК ================= -->
<div id="screen-search" class="hidden">
  <header class="top safe-top">
    <div class="logo-row"><h1 class="logo">Поиск</h1><span class="logo-sub">アニメ.</span></div>
    <input id="search-input" type="search" class="search" placeholder="Название аниме…" autocomplete="off">
  </header>
  <div id="search-status" class="status hidden"><div class="spin small"></div><span id="search-status-text">Ищем…</span></div>
  <main class="content">
    <div id="search-hint" class="empty">Введите название — например, «Наруто»</div>
    <div id="search-grid" class="grid"></div>
    <div id="search-more" class="more hidden"><div class="spin small"></div>Ещё…</div>
    <div id="search-empty" class="empty hidden">Ничего не нашлось</div>
  </main>
</div>

<!-- ================= ПЛЕЕР ================= -->
<div id="player" class="player safe-top">
  <div class="p-head">
    <button id="btn-back" class="back"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>Назад</button>
    <h2 id="p-title" class="p-title"></h2>
  </div>
  <div class="p-body">
    <div class="p-wrap">
      <iframe id="p-iframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
      <div id="p-loader" class="p-overlay"><div><div class="spin" style="margin:0 auto"></div><div class="txt">Загрузка…</div></div></div>
      <div id="p-error" class="p-overlay hidden"><div><div class="p-err-emoji">🎬</div><div class="p-err-title">Источник видео не подключён.</div><div class="p-err-sub">Попробуйте другую озвучку.</div></div></div>
    </div>
    <div id="p-voices" class="voices"></div>
    <div id="p-meta" class="meta"></div>
    <p id="p-desc" class="desc"></p>
  </div>
</div>

<!-- ================= ТАБЫ ================= -->
<nav class="tabs safe-bottom">
  <button id="tab-home" class="tab on">
    <svg fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
    <span>Главная</span></button>
  <button id="tab-search" class="tab">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    <span>Поиск</span></button>
</nav>

<div id="toast" class="toast hidden"></div>

<script>
/* ============ PWA: манифест + Service Worker ============ */
(function(){
  const iconUrl = new URL('icon.png', location.href).href;
  const m = { name:'Anime PWA', short_name:'Anime', start_url:'.', display:'standalone',
    background_color:'#0b0b0f', theme_color:'#0b0b0f',
    icons:[{src:iconUrl,sizes:'192x192',type:'image/png',purpose:'any'},{src:iconUrl,sizes:'512x512',type:'image/png'}] };
  document.getElementById('manifest-link').href =
    URL.createObjectURL(new Blob([JSON.stringify(m)], { type:'application/manifest+json' }));
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();

/* ============ КОНФИГ ============ */
const OWN_PROXY = '';
const SHIKI = 'https://shikimori.one';
const KODIK = 'https://kodik-api.com';
const LIMIT = 30, TTL = 10*60*1000, CAP = 300;

const ENC_TOKENS = [
  "==QO0ADM3kTZmRTNiRDNjFDM==QOxkDMzQjZ4ADZ4zNhZTN",
  "==QNyE2NzIjM4ETM3MmNklDM==gY5EzNxIzY0gjZ1kDZkFDN",
  "==wMjhDN5QzYkNjZyQmM2ETO==QYjZjYkRjNxMWZ3YTNidzN",
  "==QZiZDNxITZlFDZwIjZ3EjM==AN0UmZlVzN4UWO3EDZ3QDN"
];
function decryptToken(t){
  try{
    const h = Math.floor(t.length/2);
    const a = t.substring(0,h).split('').reverse().join('');
    const b = t.substring(h).split('').reverse().join('');
    return atob(b) + atob(a);
  }catch(e){ return null; }
}
const TOKENS = ENC_TOKENS.map(decryptToken).filter(Boolean);
let KODIK_TOKEN = '', tokenPromise = null;
function ensureToken(){
  if (KODIK_TOKEN) return Promise.resolve(true);
  if (tokenPromise) return tokenPromise;
  let cached = null; try{ cached = localStorage.getItem('kodik_token'); }catch(e){}
  if (cached){ KODIK_TOKEN = cached; return Promise.resolve(true); }
  return tokenPromise = (async () => {
    for (const t of TOKENS){
      KODIK_TOKEN = t;
      const r = await kodik('search', { shikimori_id:'20', limit:'1' });
      if (r && Array.isArray(r.results) && r.results.length){
        try{ localStorage.setItem('kodik_token', t); }catch(e){}
        return true;
      }
    }
    KODIK_TOKEN = TOKENS[0] || '';
    return false;
  })();
}

/* ============ FETCH: ГОНКА ПРОКСИ (параллельно, быстрый побеждает) ============ */
const RACE = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u)
];
const FALLBACK = [
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];
const anyP = Promise.any ? Promise.any.bind(Promise) : ps => new Promise((res, rej) => {
  let n = 0; ps.forEach(p => p.then(res, () => { if (++n === ps.length) rej(new Error('all failed')); }));
});
function via(u, timeout){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  return fetch(u, { signal: ctrl.signal })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(txt => { clearTimeout(t); return JSON.parse(txt); })
    .catch(e => { clearTimeout(t); throw e; });
}
async function fetchJSON(url, timeout = 6500){
  if (OWN_PROXY){ try{ return await via(OWN_PROXY + encodeURIComponent(url), timeout); }catch(e){} }
  try{ return await anyP(RACE.map(w => via(w(url), timeout))); }catch(e){}
  for (const w of FALLBACK){ try{ return await via(w(url), timeout); }catch(e){} }
  throw new Error('proxy failed');
}
async function shiki(path, params = {}){
  try{ return await fetchJSON(`${SHIKI}/api/${path}?` + new URLSearchParams(params)); }catch(e){ return null; }
}
async function kodik(path, params = {}){
  if (!KODIK_TOKEN) return null;
  try{ return await fetchJSON(`${KODIK}/${path}?` + new URLSearchParams({ token: KODIK_TOKEN, ...params })); }catch(e){ return null; }
}

/* ============ НОРМАЛИЗАЦИЯ ============ */
const normShiki = a => {
  const img = a.image || a.poster;
  return { sid: a.id, title: a.russian || a.name,
    poster: img ? SHIKI + (img.preview || img.original) : null,
    posterFull: img ? SHIKI + img.original : null,
    score: a.score, kind: a.kind, year: (a.aired_on || '').slice(0,4),
    desc: a.description || '', genres: (a.genres||[]).map(g=>g.russian) };
};
const normKodik = r => {
  const md = r.material_data || {};
  let poster = md.poster_url || md.anime_poster_url || null;
  if (poster && poster.startsWith('//')) poster = 'https:' + poster;
  return { sid: r.shikimori_id || null, title: md.title || r.title, poster, posterFull: poster,
    score: md.shikimori_rating || null, kind: md.anime_kind || r.type, year: r.year || md.year,
    desc: md.description || md.anime_description || '', genres: md.all_genres || [],
    voice: (r.translation && r.translation.title) || null, quality: r.quality || null,
    kodikLink: r.link };
};
function imgErr(im){
  const alt = im.getAttribute('data-alt');
  if (alt && im.src !== alt){ im.removeAttribute('data-alt'); im.src = alt; return; }
  const d = document.createElement('div');
  d.className = 'ph'; d.textContent = '🎬';
  im.replaceWith(d);
}

/* ============ СЕКЦИИ ============ */
const SECTIONS = {
  popular: { shiki:{order:'popularity', kind:'tv'},
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true', sort:'shikimori_rating', order:'desc'} },
  ongoing: { shiki:{order:'popularity', status:'ongoing', kind:'tv'},
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true', anime_status:'ongoing'} },
  fresh:   { shiki:null,
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true', sort:'updated_at', order:'desc'} },
  top:     { shiki:{order:'score', kind:'tv'},
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true', sort:'shikimori_rating', order:'desc'} },
  random:  { shiki:{order:'random', kind:'tv'},
             kodik:{limit:LIMIT, types:'anime,anime-serial', with_material_data:'true'} }
};

/* ============ ХРАНИЛИЩЕ ============ */
const LS = {
  get(k){ try{ return JSON.parse(localStorage.getItem('anime_' + k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('anime_' + k, JSON.stringify(v)); }catch(e){} }
};
const $ = id => document.getElementById(id);
const freshState = () => ({ items:[], keys:new Set(), page:1, nextUrl:null, done:false, source:null, rendered:0, loading:false });
const saveState = (key, f) => LS.set(key, { t:Date.now(), items:f.items.slice(0,CAP), page:f.page, nextUrl:f.nextUrl, done:f.done, source:f.source });

const home = { sec:'popular' };
let homeState = null, homeReq = 0;

async function loadHome(sec){
  const my = ++homeReq;
  home.sec = sec;
  const cached = LS.get('sec_' + sec);
  if (cached && cached.items && cached.items.length){
    homeState = { ...freshState(), items:cached.items,
      keys:new Set(cached.items.map(i => i.sid || i.title)),
      page:cached.page || 1, nextUrl:cached.nextUrl || null, done:!!cached.done, source:cached.source || null };
    $('home-grid').innerHTML = '';
    appendCards($('home-grid'), homeState.items, 0);
    homeState.rendered = homeState.items.length;
    $('home-empty').classList.add('hidden');
    if (Date.now() - (cached.t || 0) < TTL) return;
    refreshHome(sec, my);
    return;
  }
  homeState = freshState();
  skeleton($('home-grid'));
  await fetchChunk(homeState, sec);
  if (my !== homeReq) return;
  $('home-grid').innerHTML = '';
  appendCards($('home-grid'), homeState.items, 0);
  homeState.rendered = homeState.items.length;
  $('home-empty').classList.toggle('hidden', homeState.items.length > 0);
  if (homeState.items.length) saveState('sec_' + sec, homeState);
  idlePrefetch();
}

async function refreshHome(sec, my){
  const f = freshState();
  await fetchChunk(f, sec);
  if (f.items.length) saveState('sec_' + sec, f);
  if (my !== homeReq) return;
  if (window.scrollY < 400 && homeState.rendered === homeState.items.length && f.items.length){
    homeState = f;
    $('home-grid').innerHTML = '';
    appendCards($('home-grid'), f.items, 0);
    f.rendered = f.items.length;
  }
}

async function fetchChunk(f, sec){
  if (!f || f.loading) return;
  f.loading = true;
  const isAppend = f.rendered > 0;
  if (isAppend) $('home-more').classList.remove('hidden');
  const cfg = SECTIONS[sec];
  let got = [];
  if (f.source === 'shiki'){
    const s = await shiki('animes', Object.assign({}, cfg.shiki, { limit:LIMIT, page:f.page }));
    if (Array.isArray(s) && s.length){ got = s.map(normShiki); f.page++; if (s.length < LIMIT) f.done = true; }
    else f.done = true;
  } else if (f.source === 'kodik'){
    if (f.nextUrl){
      let k = null; try{ k = await fetchJSON(f.nextUrl); }catch(e){}
      if (k && k.results && k.results.length){ got = k.results.map(normKodik); f.nextUrl = k.next_page || null; if (!f.nextUrl) f.done = true; }
      else f.done = true;
    } else f.done = true;
  } else {
    if (cfg.shiki){
      const s = await shiki('animes', Object.assign({}, cfg.shiki, { limit:LIMIT, page:1 }));
      if (Array.isArray(s) && s.length){ got = s.map(normShiki); f.source = 'shiki'; f.page = 2; if (s.length < LIMIT) f.done = true; }
    }
    if (!got.length){
      await ensureToken();
      const k = await kodik('list', cfg.kodik);
      if (k && k.results && k.results.length){ got = k.results.map(normKodik); f.source = 'kodik'; f.nextUrl = k.next_page || null; if (!f.nextUrl) f.done = true; }
      else f.done = true;
    }
  }
  const before = f.items.length;
  got.forEach(it => { const k = it.sid || it.title; if (!f.keys.has(k)){ f.keys.add(k); f.items.push(it); } });
  if (isAppend && f.items.length === before) f.done = true;
  f.loading = false;
  $('home-more').classList.add('hidden');
}

async function loadHomeMore(){
  const f = homeState;
  if (!f || f.loading || f.done) return;
  const my = homeReq;
  const old = f.rendered;
  await fetchChunk(f, home.sec);
  if (my !== homeReq) return;
  appendCards($('home-grid'), f.items.slice(old), old);
  f.rendered = f.items.length;
  saveState('sec_' + home.sec, f);
}

/* Фоновый предзагруз секций в idle-время */
const prefetched = {};
function idle(fn){ ('requestIdleCallback' in window) ? requestIdleCallback(fn, { timeout: 4000 }) : setTimeout(fn, 1500); }
function idlePrefetch(){
  idle(() => { prefetchSec('ongoing'); prefetchSec('top'); });
}
function prefetchSec(sec){
  if (prefetched[sec]) return; prefetched[sec] = 1;
  const c = LS.get('sec_' + sec);
  if (c && Date.now() - (c.t || 0) < TTL) return;
  const f = freshState();
  fetchChunk(f, sec).then(() => { if (f.items.length) saveState('sec_' + sec, f); });
}

/* ============ ПОИСК (с кешем последнего запроса) ============ */
let searchState = null, searchReq = 0, searchCache = null, searchTimer;

function restoreSearch(f){
  searchState = { ...freshState(), q:f.q, items:f.items, keys:new Set(f.items.map(i => i.sid || i.title)),
    page:f.page || 1, nextUrl:f.nextUrl || null, done:!!f.done, source:f.source || null };
  $('search-grid').innerHTML = '';
  appendCards($('search-grid'), searchState.items, 0);
  searchState.rendered = searchState.items.length;
  $('search-hint').classList.add('hidden');
  $('search-empty').classList.add('hidden');
  searchStatus(null);
}

async function doSearch(q, append = false){
  const my = ++searchReq;
  if (!append){
    if (searchCache && searchCache.q === q && searchCache.items.length){ restoreSearch(searchCache); return; }
    const ls = LS.get('q');
    if (ls && ls.q === q && ls.items && ls.items.length && Date.now() - (ls.t || 0) < TTL){
      searchCache = ls; restoreSearch(ls); return;
    }
    searchState = { q, ...freshState() };
    $('search-hint').classList.add('hidden');
    $('search-empty').classList.add('hidden');
    skeleton($('search-grid'), 6);
    searchStatus('Ищем «' + q + '»…');
  }
  await fetchSearchChunk(q);
  if (my !== searchReq) return;
  searchStatus(null);
  const old = searchState.rendered;
  if (!append) $('search-grid').innerHTML = '';
  appendCards($('search-grid'), searchState.items.slice(append ? old : 0), append ? old : 0);
  searchState.rendered = searchState.items.length;
  $('search-empty').classList.toggle('hidden', searchState.items.length > 0);
  if (searchState.items.length){ searchCache = searchState; LS.set('q', { t:Date.now(), q, items:searchState.items.slice(0,90), page:searchState.page, done:searchState.done, source:searchState.source }); }
}

async function fetchSearchChunk(q){
  const f = searchState;
  if (!f || f.loading) return;
  f.loading = true;
  if (f.rendered > 0) $('search-more').classList.remove('hidden');
  let got = [];
  if (f.source === 'shiki'){
    const s = await shiki('animes', { search:q, limit:LIMIT, page:f.page });
    if (Array.isArray(s) && s.length){ got = s.map(normShiki); f.page++; if (s.length < LIMIT) f.done = true; }
    else f.done = true;
  } else {
    const s = await shiki('animes', { search:q, limit:LIMIT, page:1 });
    if (Array.isArray(s) && s.length){ got = s.map(normShiki); f.source = 'shiki'; f.page = 2; if (s.length < LIMIT) f.done = true; }
    if (!got.length){
      await ensureToken();
      const k = await kodik('search', { title:q, limit:LIMIT, types:'anime,anime-serial', with_material_data:'true' });
      if (k && k.results && k.results.length){ got = k.results.map(normKodik); f.source = 'kodik'; f.done = true; }
      else f.done = true;
    }
  }
  const before = f.items.length;
  got.forEach(it => { const k = it.sid || it.title; if (!f.keys.has(k)){ f.keys.add(k); f.items.push(it); } });
  if (f.rendered > 0 && f.items.length === before) f.done = true;
  f.loading = false;
  $('search-more').classList.add('hidden');
}

async function loadSearchMore(){
  const f = searchState;
  if (!f || f.loading || f.done) return;
  if ($('search-input').value.trim() !== f.q) return;
  const my = searchReq, old = f.rendered;
  await fetchSearchChunk(f.q);
  if (my !== searchReq) return;
  appendCards($('search-grid'), f.items.slice(old), old);
  f.rendered = f.items.length;
}

/* ============ UI ============ */
function toast(m){ const el = $('toast'); el.textContent = m; el.classList.remove('hidden');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('hidden'), 2500); }
function searchStatus(msg){ const el = $('search-status');
  el.classList.toggle('hidden', !msg);
  if (msg) $('search-status-text').textContent = msg; }
function skeleton(grid, n = 12){
  let h = '';
  for (let i = 0; i < n; i++) h += '<div><div class="skel"></div><div class="skel skel-line"></div></div>';
  grid.innerHTML = h;
}

function appendCards(grid, arr, startIdx){
  arr.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'card';
    b.onclick = () => openPlayer(it);
    const hi = (startIdx + i) < 9 ? ' fetchpriority="high"' : '';
    b.innerHTML = `
      <div class="poster">
        ${it.poster
          ? `<img src="${it.poster}" ${it.posterFull && it.posterFull !== it.poster ? `data-alt="${it.posterFull}"` : ''} loading="lazy" decoding="async"${hi} onerror="imgErr(this)">`
          : '<div class="ph">🎬</div>'}
        ${it.score ? `<span class="badge">★ ${it.score}</span>` : ''}
      </div>
      <div class="ctitle">${it.title}</div>`;
    grid.appendChild(b);
  });
}

function setTab(name){
  const h = name === 'home';
  $('screen-home').classList.toggle('hidden', !h);
  $('screen-search').classList.toggle('hidden', h);
  $('tab-home').classList.toggle('on', h);
  $('tab-search').classList.toggle('on', !h);
  if (!h) setTimeout(() => $('search-input').focus(), 60);
}

/* ============ ПЛЕЕР ============ */
async function openPlayer(item){
  $('player').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('p-title').textContent = item.title;
  $('p-iframe').src = 'about:blank';
  $('p-loader').classList.remove('hidden');
  $('p-error').classList.add('hidden');
  $('p-voices').innerHTML = '';
  $('p-meta').textContent = [item.kind, item.year, item.score ? '★ ' + item.score : ''].filter(Boolean).join(' · ');
  $('p-desc').textContent = item.desc || 'Загрузка…';

  if (!item.desc && item.sid){
    const d = await shiki('animes/' + item.sid);
    $('p-desc').textContent = (d && d.description) ? d.description : 'Описание отсутствует';
  } else $('p-desc').textContent = item.desc || 'Описание отсутствует';

  await ensureToken();
  let results = [];
  if (item.sid){
    const k = await kodik('search', { shikimori_id:item.sid, with_material_data:'true' });
    if (k && k.results && k.results.length) results = k.results.map(normKodik);
  }
  if (!results.length){
    const k = await kodik('search', { title:item.title, limit:'10', types:'anime,anime-serial' });
    if (k && k.results && k.results.length) results = k.results.map(normKodik);
  }
  if (!results.length){
    $('p-loader').classList.add('hidden');
    $('p-error').classList.remove('hidden');
    return;
  }

  const v = $('p-voices');
  results.forEach((r, i) => {
    const b = document.createElement('button');
    b.className = 'voice' + (i === 0 ? ' on' : '');
    b.textContent = (r.voice || 'Вариант ' + (i+1)) + (r.quality ? ' · ' + r.quality : '');
    b.onclick = () => { v.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); setPlayer(r); };
    v.appendChild(b);
  });
  setPlayer(results[0]);
}
function setPlayer(r){
  let l = r.kodikLink || '';
  if (l.startsWith('//')) l = 'https:' + l;
  $('p-iframe').src = l;
  $('p-iframe').onload = () => $('p-loader').classList.add('hidden');
  $('p-meta').textContent = [r.kind, r.year, r.quality, r.voice ? '🎙 ' + r.voice : '', r.score ? '★ ' + r.score : ''].filter(Boolean).join(' · ');
}
function closePlayer(){
  $('player').classList.remove('open');
  $('p-iframe').src = 'about:blank';
  document.body.style.overflow = '';
}

/* ============ СОБЫТИЯ ============ */
document.querySelectorAll('.sec-chip').forEach(ch => ch.onclick = () => {
  document.querySelectorAll('.sec-chip').forEach(c => c.classList.remove('on'));
  ch.classList.add('on');
  if (ch.dataset.sec === 'random') toast('🍥 Случайная подборка');
  loadHome(ch.dataset.sec);
});
$('tab-home').onclick = () => setTab('home');
$('tab-search').onclick = () => setTab('search');
$('btn-back').onclick = closePlayer;

$('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q){
    searchReq++;
    searchStatus(null);
    $('search-grid').innerHTML = '';
    $('search-empty').classList.add('hidden');
    $('search-hint').classList.remove('hidden');
    return;
  }
  searchTimer = setTimeout(() => doSearch(q), 350);
});

window.addEventListener('scroll', () => {
  if ($('player').classList.contains('open')) return;
  if (window.innerHeight + window.scrollY < document.body.offsetHeight - 800) return;
  if (!$('screen-home').classList.contains('hidden')) loadHomeMore();
  else loadSearchMore();
}, { passive:true });

/* ============ СТАРТ ============ */
setTab('home');
loadHome('popular');
</script>
</body>
